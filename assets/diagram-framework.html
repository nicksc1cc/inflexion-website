<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Inflexion framework · Process</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#FAFAF9;--ink:#0A0A0B;--muted:#71717A;--soft:#A1A1AA;--accent:#FF5A1F;--accent-tint:rgba(255,90,31,.08);--rule:rgba(10,10,11,.12);--label-rule:rgba(10,10,11,.20);--lane:rgba(10,10,11,.018);--node:#fff;--node-stroke:rgba(10,10,11,.25);--chip:rgba(10,10,11,.12);--dot:rgba(10,10,11,.10);--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1120px;width:100%}.eyebrow{font:500 .66rem var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}h1{font:400 clamp(1.5rem,2.4vw + .75rem,2rem)/1.15 var(--serif);letter-spacing:-.02em;margin-bottom:1.5rem}svg{width:100%;min-width:1000px;display:block}
    svg text{font-family:var(--sans)}.mono{font-family:var(--mono)}.lane{fill:var(--lane)}.rule{stroke:var(--rule)}.label-rule{stroke:var(--label-rule)}.actor{fill:var(--muted);font:500 8px var(--mono);letter-spacing:.08em}.step-label{fill:var(--muted);font:500 6px var(--mono);letter-spacing:.12em}.step-chip{fill:var(--chip)}.step-num{fill:var(--ink);font:600 7px var(--mono)}.connector{fill:none;stroke:var(--muted);stroke-width:1}.connector.focal{stroke:var(--accent);stroke-width:1.2}.node-mask{fill:var(--paper)}.node{fill:var(--node);stroke:var(--node-stroke)}.node.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}.role{fill:rgba(10,10,11,.10)}.role.focal{fill:rgba(255,90,31,.25)}.role-text{fill:var(--ink);font:600 6px var(--mono)}.role-text.focal{fill:var(--accent)}.node-title{fill:var(--ink);font:600 9px var(--sans)}.node-sub{fill:var(--muted);font:6.5px var(--mono)}.legend-key{fill:var(--muted);font:500 7px var(--mono);letter-spacing:.12em}.legend-text{fill:var(--muted);font:8px var(--sans)}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Inflexion Framework</p>
    <h1>Diagnose. Measure. Run.</h1>
    <svg viewBox="0 0 1064 400" xmlns="http://www.w3.org/2000/svg" aria-label="Inflexion framework: Diagnose, Measure, Run" role="img" aria-labelledby="framework-title framework-desc">
      <title id="framework-title">Diagnose. Measure. Run.</title>
      <desc id="framework-desc">Three-phase framework showing how Inflexion diagnoses AI visibility, measures share of answer and shelf, then runs the optimised operating model.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="var(--dot)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker>
      </defs>
      <rect width="1064" height="400" fill="var(--paper)"/><rect width="1064" height="400" fill="url(#dots)" opacity=".55"/>
      
      <!-- Phase labels (top banner) -->
      <g text-anchor="middle">
        <rect class="step-chip" x="80" y="12" width="16" height="16" rx="8"/><text class="step-num" x="88" y="23">1</text><text class="step-label" x="120" y="23">DIAGNOSE</text>
        <rect class="step-chip" x="420" y="12" width="16" height="16" rx="8"/><text class="step-num" x="428" y="23">2</text><text class="step-label" x="460" y="23">MEASURE</text>
        <rect class="step-chip" x="760" y="12" width="16" height="16" rx="8"/><text class="step-num" x="768" y="23">3</text><text class="step-label" x="800" y="23">RUN</text>
      </g>

      <!-- Phase 1: Diagnose nodes -->
      <g text-anchor="middle">
        <!-- Prompt set audit -->
        <rect class="node-mask" x="40" y="60" width="160" height="72" rx="6"/><rect class="node" x="40" y="60" width="160" height="72" rx="6"/>
        <rect class="role" x="44" y="64" width="20" height="10" rx="2"/><text class="role-text" x="54" y="72">D1</text>
        <text class="node-title" x="120" y="90">Prompt set audit</text>
        <text class="node-sub" x="120" y="106">Buyer questions × 4+ models</text>
        <text class="node-tool" x="120" y="120">Who is cited, where, how often</text>

        <!-- Source authority map -->
        <rect class="node-mask" x="40" y="160" width="160" height="72" rx="6"/><rect class="node" x="40" y="160" width="160" height="72" rx="6"/>
        <rect class="role" x="44" y="164" width="20" height="10" rx="2"/><text class="role-text" x="54" y="172">D2</text>
        <text class="node-title" x="120" y="190">Source map</text>
        <text class="node-sub" x="120" y="206">What models trust, ranked</text>
        <text class="node-tool" x="120" y="220">Outlets, papers, forums</text>

        <!-- Gap analysis -->
        <rect class="node-mask" x="40" y="260" width="160" height="72" rx="6"/><rect class="node focal" x="40" y="260" width="160" height="72" rx="6"/>
        <rect class="role focal" x="44" y="264" width="20" height="10" rx="2"/><text class="role-text focal" x="54" y="272">D3</text>
        <text class="node-title" x="120" y="290">Citation gap</text>
        <text class="node-sub" x="120" y="306">You vs competitors vs nobody</text>
        <text class="node-tool" x="120" y="320">Ranked fix list</text>
      </g>

      <!-- Connectors: Diagnose → Measure -->
      <path class="connector focal" d="M200 296 H300 Q308 296 308 288 V220" marker-end="url(#arrow-accent)"/>

      <!-- Phase 2: Measure nodes -->
      <g text-anchor="middle">
        <rect class="node-mask" x="380" y="60" width="200" height="72" rx="6"/><rect class="node" x="380" y="60" width="200" height="72" rx="6"/>
        <rect class="role" x="384" y="64" width="20" height="10" rx="2"/><text class="role-text" x="394" y="72">M1</text>
        <text class="node-title" x="480" y="90">Share of answer</text>
        <text class="node-sub" x="480" y="106">Across ChatGPT, Gemini, Perplexity</text>
        <text class="node-tool" x="480" y="120">Position within answer · citation velocity</text>

        <rect class="node-mask" x="380" y="160" width="200" height="72" rx="6"/><rect class="node" x="380" y="160" width="200" height="72" rx="6"/>
        <rect class="role" x="384" y="164" width="20" height="10" rx="2"/><text class="role-text" x="394" y="172">M2</text>
        <text class="node-title" x="480" y="190">Share of shelf</text>
        <text class="node-sub" x="480" y="206">Paid vs organic shelf position</text>
        <text class="node-tool" x="480" y="220">Algorithmic rank drivers</text>

        <rect class="node-mask" x="380" y="260" width="200" height="72" rx="6"/><rect class="node focal" x="380" y="260" width="200" height="72" rx="6"/>
        <rect class="role focal" x="384" y="264" width="20" height="10" rx="2"/><text class="role-text focal" x="394" y="272">M3</text>
        <text class="node-title" x="480" y="290">Baseline report</text>
        <text class="node-sub" x="480" y="306">Fixed, published, repeatable</text>
        <text class="node-tool" x="480" y="320">Month-over-month tracking</text>
      </g>

      <!-- Connectors: Measure → Run -->
      <path class="connector focal" d="M580 296 H700 Q708 296 708 288 V220" marker-end="url(#arrow-accent)"/>

      <!-- Phase 3: Run nodes -->
      <g text-anchor="middle">
        <rect class="node-mask" x="760" y="60" width="200" height="72" rx="6"/><rect class="node" x="760" y="60" width="200" height="72" rx="6"/>
        <rect class="role" x="764" y="64" width="20" height="10" rx="2"/><text class="role-text" x="774" y="72">R1</text>
        <text class="node-title" x="860" y="90">Content built for citation</text>
        <text class="node-sub" x="860" y="106">One question per page</text>
        <text class="node-tool" x="860" y="120">Schema · authority · freshness</text>

        <rect class="node-mask" x="760" y="160" width="200" height="72" rx="6"/><rect class="node" x="760" y="160" width="200" height="72" rx="6"/>
        <rect class="role" x="764" y="164" width="20" height="10" rx="2"/><text class="role-text" x="774" y="172">R2</text>
        <text class="node-title" x="860" y="190">Shelf optimisation</text>
        <text class="node-sub" x="860" y="206">Separate paid from organic</text>
        <text class="node-tool" x="860" y="220">Algorithm-aware placement</text>

        <rect class="node-mask" x="760" y="260" width="200" height="72" rx="6"/><rect class="node focal" x="760" y="260" width="200" height="72" rx="6"/>
        <rect class="role focal" x="764" y="264" width="20" height="10" rx="2"/><text class="role-text focal" x="774" y="272">R3</text>
        <text class="node-title" x="860" y="290">One team, one system</text>
        <text class="node-sub" x="860" y="306">Discovery + shelf together</text>
        <text class="node-tool" x="860" y="320">Same signals, same measurement</text>
      </g>

      <!-- Internal Diagnose connectors -->
      <path class="connector" d="M120 132 V160" marker-end="url(#arrow)"/>
      <path class="connector" d="M120 232 V260" marker-end="url(#arrow)"/>

      <!-- Internal Measure connectors -->
      <path class="connector" d="M480 132 V160" marker-end="url(#arrow)"/>
      <path class="connector" d="M480 232 V260" marker-end="url(#arrow)"/>

      <!-- Internal Run connectors -->
      <path class="connector" d="M860 132 V160" marker-end="url(#arrow)"/>
      <path class="connector" d="M860 232 V260" marker-end="url(#arrow)"/>
    </svg>
  </div>
</body>
</html>
