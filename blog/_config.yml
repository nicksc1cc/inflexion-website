# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: Inflexion — Perspectives
subtitle: 'Marketing for the AI inflection'
description: 'Perspectives on AI marketing, AEO, retail media, and the changing economics of brand visibility.'
keywords: [AEO, AI marketing, retail media, GEO, answer engine optimisation]
author: Inflexion
language: en
timezone: ''

# URL
url: https://nicksc1cc.github.io/inflexion-website/blog/
root: /inflexion-website/blog/
permalink: :year/:month/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
## Themes: https://hexo.io/themes/
theme: landscape

# Deployment
deploy:
  type: ''