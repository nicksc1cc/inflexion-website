<figure class="exhibit" role="figure" aria-label="Marketing mix and marginal return analysis">
<div class="exhibit-title">Where should the next £1m go?</div>
<div class="exhibit-question">Estimated incremental return by channel at current spend levels</div>
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:800px;font-family:Montserrat,sans-serif">
  <defs>
    <style>
      .bg-line{stroke:rgba(10,10,11,.06);stroke-width:1}
      .label-mono{font-size:10px;fill:#71717A;font-weight:500;font-family:IBM Plex Mono,monospace}
      .bar-ctv{fill:rgba(36,56,218,.4)}
      .bar-social{fill:rgba(36,56,218,.5)}
      .bar-search{fill:rgba(36,56,218,.65)}
      .bar-amazon{fill:rgba(36,56,218,.8)}
      .bar-rm{fill:rgba(36,56,218,.95)}
      .bar-current{fill:rgba(10,10,11,.15)}
      .annot-text{font-size:11px;fill:#0A0A0B;font-weight:400}
      .annot-bold{font-size:11px;fill:#FF5A1F;font-weight:600}
      .finding-text{font-size:12px;fill:#2438DA;font-weight:500}
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#FAFAF9"/>
  
  <!-- LEFT: Marginal return chart -->
  <text x="100" y="35" class="label-mono" font-size="11">Marginal incremental return by channel</text>
  <!-- Grid -->
  <line x1="90" y1="60" x2="380" y2="60" class="bg-line"/>
  <line x1="90" y1="110" x2="380" y2="110" class="bg-line"/>
  <line x1="90" y1="160" x2="380" y2="160" class="bg-line"/>
  <line x1="90" y1="210" x2="380" y2="210" class="bg-line"/>
  <line x1="90" y1="260" x2="380" y2="260" class="bg-line"/>
  <line x1="90" y1="310" x2="380" y2="310" class="bg-line"/>
  <!-- Y-axis labels -->
  <text x="80" y="64" class="label-mono" text-anchor="end">3.5x</text>
  <text x="80" y="114" class="label-mono" text-anchor="end">3.0x</text>
  <text x="80" y="164" class="label-mono" text-anchor="end">2.5x</text>
  <text x="80" y="214" class="label-mono" text-anchor="end">2.0x</text>
  <text x="80" y="264" class="label-mono" text-anchor="end">1.5x</text>
  <text x="80" y="314" class="label-mono" text-anchor="end">1.0x</text>
  
  <!-- Horizontal reference lines at 1.5x and 2.5x -->
  <line x1="90" y1="264" x2="380" y2="264" stroke="rgba(255,90,31,.15)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="90" y1="164" x2="380" y2="164" stroke="rgba(255,90,31,.15)" stroke-width="1" stroke-dasharray="4,3"/>
  
  <!-- Response curves (simplified log-linear) -->
  <!-- CTV: £20k=3.8x, £40k=3.2x, £60k=2.6x, £80k=2.0x, £100k=1.5x -->
  <!-- Scaled: 3.8x=56, 1.5x=264 -->
  <polyline points="100,56 140,72 180,92 220,120 260,160" class="bar-ctv" stroke="rgba(36,56,218,.6)" stroke-width="2" fill="none"/>
  <circle cx="100" cy="56" r="3" fill="rgba(36,56,218,.6)"/>
  <circle cx="220" cy="120" r="3" fill="rgba(36,56,218,.6)"/>
  <text x="270" y="56" class="label-mono" font-size="9">CTV</text>
  
  <!-- Social: £20k=4.2x, £40k=3.5x, £60k=2.8x, £80k=2.2x, £100k=1.6x -->
  <!-- 4.2x=44, 1.6x=256 -->
  <polyline points="100,44 140,60 180,80 220,108 260,156" class="bar-social" stroke="rgba(36,56,218,.7)" stroke-width="2" fill="none"/>
  <circle cx="100" cy="44" r="3" fill="rgba(36,56,218,.7)"/>
  <circle cx="220" cy="108" r="3" fill="rgba(36,56,218,.7)"/>
  <text x="270" y="44" class="label-mono" font-size="9">Social</text>
  
  <!-- Search: £20k=5.5x, £40k=4.8x, £60k=3.8x, £80k=2.8x, £100k=2.0x -->
  <polyline points="100,16 140,32 180,52 220,80 260,120" class="bar-search" stroke="rgba(36,56,218,.8)" stroke-width="2" fill="none"/>
  <circle cx="100" cy="16" r="3" fill="rgba(36,56,218,.8)"/>
  <text x="270" y="16" class="label-mono" font-size="9">Search</text>
  
  <!-- Amazon: £20k=6.0x, £40k=5.2x, £60k=4.0x, £80k=3.0x, £100k=2.2x -->
  <polyline points="100,8 140,24 180,48 220,72 260,112" class="bar-amazon" stroke="rgba(36,56,218,.9)" stroke-width="2" fill="none"/>
  <circle cx="100" cy="8" r="3" fill="rgba(36,56,218,.9)"/>
  <text x="270" y="8" class="label-mono" font-size="9">Amazon</text>
  
  <!-- X-axis labels -->
  <text x="100" y="330" class="label-mono" text-anchor="middle">£20k</text>
  <text x="140" y="330" class="label-mono" text-anchor="middle">£40k</text>
  <text x="180" y="330" class="label-mono" text-anchor="middle">£60k</text>
  <text x="220" y="330" class="label-mono" text-anchor="middle">£80k</text>
  <text x="260" y="330" class="label-mono" text-anchor="middle">£100k</text>
  <text x="180" y="350" class="label-mono" text-anchor="middle">Monthly spend</text>
  
  <!-- RIGHT: Reallocation scenario -->
  <text x="450" y="35" class="label-mono" font-size="11">Reallocation scenario: + £1M</text>
  
  <!-- Current allocation bars -->
  <!-- CTV: £1,000k · Social: £825k · Search: £670k · Amazon: £600k · RM: £512k · Total: £3,607k -->
  <!-- Scale: max width = 300px, max value = £1000k = 300px -->
  <text x="450" y="70" class="label-mono" font-size="9">Current</text>
  <rect x="450" y="76" width="300" height="12" fill="rgba(10,10,11,.06)"/>
  <rect x="450" y="76" width="248" height="12" class="bar-ctv"/> <!-- CTV 83% -->
  <rect x="450" y="90" width="205" height="12" class="bar-social"/>
  <rect x="450" y="104" width="166" height="12" class="bar-search"/>
  <rect x="450" y="118" width="149" height="12" class="bar-amazon"/>
  <rect x="450" y="132" width="127" height="12" class="bar-rm"/>
  
  <text x="700" y="84" class="label-mono" font-size="8">CTV</text>
  <text x="700" y="98" class="label-mono" font-size="8">Social</text>
  <text x="700" y="112" class="label-mono" font-size="8">Search</text>
  <text x="700" y="126" class="label-mono" font-size="8">Amazon</text>
  <text x="700" y="140" class="label-mono" font-size="8">RM</text>
  <text x="560" y="156" class="label-mono" font-size="9">Total: £3.6M</text>
  
  <!-- Reallocated bars -->
  <text x="450" y="182" class="label-mono" font-size="9">Reallocated (+ £1M)</text>
  <rect x="450" y="188" width="300" height="12" fill="rgba(10,10,11,.06)"/>
  <rect x="450" y="188" width="240" height="12" class="bar-ctv"/> <!-- CTV £900k +100k = £1M = 80% -->
  <rect x="450" y="202" width="165" height="12" class="bar-social"/> <!-- Social £825k -225k = £600k = 48% -->
  <rect x="450" y="216" width="180" height="12" class="bar-search"/> <!-- Search £670k +230k = £900k = 72% -->
  <rect x="450" y="230" width="210" height="12" class="bar-amazon"/> <!-- Amazon £600k +400k = £1M = 80% -->
  <rect x="450" y="244" width="195" height="12" class="bar-rm"/> <!-- RM £512k +295k = £807k = 64.5% -->
  <!-- Total: £1,000k new + £3,607k = £4,607k -->
  
  <!-- Arrow indicators -->
  <text x="695" y="198" class="annot-text" font-size="10" fill="#4ade80">+100k</text>
  <text x="695" y="212" class="annot-text" font-size="10" fill="#f87171">-225k</text>
  <text x="695" y="226" class="annot-text" font-size="10" fill="#4ade80">+230k</text>
  <text x="695" y="240" class="annot-text" font-size="10" fill="#4ade80">+400k</text>
  <text x="695" y="254" class="annot-text" font-size="10" fill="#4ade80">+295k</text>
  
  <!-- Finding -->
  <rect x="450" y="270" width="310" height="60" rx="2" fill="rgba(36,56,218,.04)" stroke="rgba(36,56,218,.2)" stroke-width="1"/>
  <text x="465" y="290" class="annot-bold" font-size="11">Estimated impact</text>
  <text x="465" y="308" class="annot-text" font-size="10">Shifting £225k from Social to Amazon and Search</text>
  <text x="465" y="322" class="annot-text" font-size="10">increases estimated incremental contribution by £480k</text>
  
  <!-- Note -->
  <text x="450" y="365" class="label-mono" font-size="9">Historical estimates vs scenario forecasts — see methodology notes</text>
</svg>
<div class="exhibit-finding">Reallocating £225k from Social to Amazon and Search, combined with £1M incremental investment, increases estimated incremental contribution by approximately £480k. Response curves reveal diminishing returns above £80k/month for most channels.</div>
<div class="exhibit-footnote">Illustrative scenario based on synthetic BellaHome data. Response curves modelled using log-linear approximation. Actual results depend on market conditions, competitive activity and execution quality. Budget moved out equals budget moved in.</div>
</figure>
