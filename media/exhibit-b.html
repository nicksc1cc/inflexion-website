<figure class="exhibit" role="figure" aria-label="Incrementality analysis comparing treatment and control groups">
<div class="exhibit-title">Did the media cause the lift?</div>
<div class="exhibit-question">Treatment vs control: estimated incremental effect of Q3 campaign</div>
<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:800px;font-family:Montserrat,sans-serif">
  <defs>
    <style>
      .bg-line{stroke:rgba(10,10,11,.06);stroke-width:1}
      .label-mono{font-size:10px;fill:#71717A;font-weight:500;font-family:IBM Plex Mono,monospace}
      .treat-line{stroke:#2438DA;stroke-width:2;fill:none}
      .treat-dot{fill:#2438DA;r:3.5}
      .control-line{stroke:rgba(10,10,11,.2);stroke-width:1.5;fill:none}
      .control-dot{fill:rgba(10,10,11,.2);r:3}
      .annot-text{font-size:11px;fill:#0A0A0B;font-weight:400}
      .annot-bold{font-size:11px;fill:#FF5A1F;font-weight:600}
      .finding-text{font-size:12px;fill:#2438DA;font-weight:500}
      .arrow-line{stroke:#FF5A1F;stroke-width:1.5}
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="380" fill="#FAFAF9"/>
  
  <!-- Pre period label -->
  <text x="140" y="30" class="label-mono" text-anchor="middle">Pre-period</text>
  <line x1="90" y1="34" x2="190" y2="34" class="bg-line"/>
  
  <!-- Test period label -->
  <text x="330" y="30" class="label-mono" text-anchor="middle" fill="#2438DA">Test period (campaign active)</text>
  <line x1="240" y1="34" x2="420" y2="34" stroke="rgba(36,56,218,.2)" stroke-width="1"/>
  
  <!-- Follow-up -->
  <text x="530" y="30" class="label-mono" text-anchor="middle">Follow-up</text>
  <line x1="470" y1="34" x2="590" y2="34" class="bg-line"/>
  
  <!-- Gridlines -->
  <line x1="90" y1="60" x2="740" y2="60" class="bg-line"/>
  <line x1="90" y1="110" x2="740" y2="110" class="bg-line"/>
  <line x1="90" y1="160" x2="740" y2="160" class="bg-line"/>
  <line x1="90" y1="210" x2="740" y2="210" class="bg-line"/>
  <line x1="90" y1="260" x2="740" y2="260" class="bg-line"/>
  <line x1="90" y1="310" x2="740" y2="310" class="bg-line"/>
  
  <!-- Y-axis -->
  <text x="80" y="64" class="label-mono" text-anchor="end">120</text>
  <text x="80" y="114" class="label-mono" text-anchor="end">110</text>
  <text x="80" y="164" class="label-mono" text-anchor="end">100</text>
  <text x="80" y="214" class="label-mono" text-anchor="end">90</text>
  <text x="80" y="264" class="label-mono" text-anchor="end">80</text>
  <text x="80" y="314" class="label-mono" text-anchor="end">Base</text>
  <text x="65" y="340" class="label-mono" text-anchor="end">Index</text>
  
  <!-- X-axis time points: W-2, W-1, W1, W2, W3, W4, W+2, W+4 -->
  <text x="90" y="345" class="label-mono" text-anchor="middle">W-2</text>
  <text x="140" y="345" class="label-mono" text-anchor="middle">W-1</text>
  <text x="240" y="345" class="label-mono" text-anchor="middle">W1</text>
  <text x="290" y="345" class="label-mono" text-anchor="middle">W2</text>
  <text x="340" y="345" class="label-mono" text-anchor="middle">W3</text>
  <text x="390" y="345" class="label-mono" text-anchor="middle">W4</text>
  <text x="490" y="345" class="label-mono" text-anchor="middle">W+2</text>
  <text x="540" y="345" class="label-mono" text-anchor="middle">W+4</text>
  
  <!-- Vertical line separating pre from test -->
  <line x1="190" y1="60" x2="190" y2="310" stroke="rgba(36,56,218,.3)" stroke-width="1" stroke-dasharray="4,3"/>
  
  <!-- Control line (flat throughout) -->
  <polyline points="90,210 140,210 240,210 290,210 340,210 390,210 490,210 540,210" class="control-line"/>
  <circle cx="90" cy="210" r="3" class="control-dot"/>
  <circle cx="140" cy="210" r="3" class="control-dot"/>
  <circle cx="240" cy="210" r="3" class="control-dot"/>
  <circle cx="290" cy="210" r="3" class="control-dot"/>
  <circle cx="340" cy="210" r="3" class="control-dot"/>
  <circle cx="390" cy="210" r="3" class="control-dot"/>
  <circle cx="490" cy="210" r="3" class="control-dot"/>
  <circle cx="540" cy="210" r="3" class="control-dot"/>
  
  <!-- Treatment line -->
  <polyline points="90,210 140,215 240,195 290,180 340,165 390,160 490,175 540,195" class="treat-line"/>
  <circle cx="90" cy="210" r="3.5" class="treat-dot"/>
  <circle cx="140" cy="215" r="3.5" class="treat-dot"/>
  <circle cx="240" cy="195" r="3.5" class="treat-dot"/>
  <circle cx="290" cy="180" r="3.5" class="treat-dot"/>
  <circle cx="340" cy="165" r="3.5" class="treat-dot"/>
  <circle cx="390" cy="160" r="3.5" class="treat-dot"/>
  <circle cx="490" cy="175" r="3.5" class="treat-dot"/>
  <circle cx="540" cy="195" r="3.5" class="treat-dot"/>
  
  <!-- Annotation: incremental effect -->
  <line x1="340" y1="165" x2="340" y2="210" stroke="#FF5A1F" stroke-width="1.5"/>
  <text x="345" y="192" class="annot-bold" font-size="11">+22%</text>
  <text x="345" y="205" class="annot-text" font-size="10">incremental</text>
  
  <!-- Effect fade arrow -->
  <line x1="490" y1="175" x2="490" y2="210" stroke="#FF5A1F" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="495" y="197" class="annot-text" font-size="10">effect fades</text>
  
  <!-- Legend -->
  <line x1="100" y1="365" x2="130" y2="365" stroke="#2438DA" stroke-width="2"/>
  <text x="137" y="369" class="label-mono" font-size="10">Treatment (exposed to media)</text>
  <line x1="310" y1="365" x2="340" y2="365" stroke="rgba(10,10,11,.2)" stroke-width="1.5"/>
  <text x="347" y="369" class="label-mono" font-size="10">Control (not exposed)</text>
</svg>
<div class="exhibit-finding">Estimated incremental effect: +22% during the test period, fading to approximately +7% four weeks post-campaign. Without the experiment, this would appear as platform-reported ROAS with no way to separate causal impact from organic demand.</div>
<div class="exhibit-footnote">Illustrative synthetic example. Treatment and control randomly assigned at DMA level. 95% confidence interval: +14% to +30%. Full methodology available on request.</div>
</figure>
