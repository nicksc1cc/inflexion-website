<figure class="exhibit" role="figure" aria-label="Marketing intelligence system showing how knowledge accumulates">
<div class="exhibit-title">Marketing intelligence that learns</div>
<div class="exhibit-question">How accumulated signals, analysis and outcomes improve the next decision</div>
<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:800px;font-family:Montserrat,sans-serif">
  <defs>
    <style>
      .bg-line{stroke:rgba(10,10,11,.06);stroke-width:1}
      .label-mono{font-size:9px;fill:#71717A;font-weight:500;font-family:IBM Plex Mono,monospace}
      .annot-text{font-size:10px;fill:#0A0A0B;font-weight:400}
      .annot-bold{font-size:11px;fill:#FF5A1F;font-weight:600}
      .signal-box{fill:rgba(36,56,218,.04);stroke:rgba(36,56,218,.2);stroke-width:1}
      .model-box{fill:rgba(36,56,218,.08);stroke:rgba(36,56,218,.35);stroke-width:1.5}
      .action-box{fill:rgba(255,90,31,.04);stroke:rgba(255,90,31,.2);stroke-width:1}
      .connector{stroke:rgba(10,10,11,.12);stroke-width:1;fill:none}
      .dot-sig{fill:#2438DA;r:2.5}
      .dot-act{fill:#FF5A1F;r:2.5}
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="380" fill="#FAFAF9"/>
  
  <!-- LEFT: Signal sources -->
  <text x="50" y="30" class="label-mono" fill="#2438DA" font-weight="600">Signal sources</text>
  <!-- Mini cards -->
  <rect x="30" y="40" width="160" height="24" rx="2" class="signal-box"/>
  <text x="42" y="56" class="annot-text" font-size="9">● Competitor A video spend +40%</text>
  
  <rect x="30" y="70" width="160" height="24" rx="2" class="signal-box"/>
  <text x="42" y="86" class="annot-text" font-size="9">● Branded search conversion -12%</text>
  
  <rect x="30" y="100" width="160" height="24" rx="2" class="signal-box"/>
  <text x="42" y="116" class="annot-text" font-size="9">● Category demand +6% YoY</text>
  
  <rect x="30" y="130" width="160" height="24" rx="2" class="signal-box"/>
  <text x="42" y="146" class="annot-text" font-size="9">● Competitor B new product launch</text>
  
  <rect x="30" y="160" width="160" height="24" rx="2" class="signal-box"/>
  <text x="42" y="176" class="annot-text" font-size="9">● Review sentiment -8% (value)</text>
  
  <!-- CENTRE: Knowledge Model -->
  <rect x="260" y="30" width="280" height="160" rx="3" class="model-box"/>
  <text x="310" y="55" class="label-mono" fill="#2438DA" font-weight="600" font-size="11">Knowledge model</text>
  
  <line x1="280" y1="70" x2="520" y2="70" class="bg-line"/>
  
  <text x="280" y="90" class="annot-text" font-size="9">Brand: BellaHome / Home & Personal Care</text>
  <text x="280" y="108" class="annot-text" font-size="9">Campaign history: 14 campaigns, 48 variations</text>
  <text x="280" y="126" class="annot-text" font-size="9">Audience segments: 9 identified</text>
  <text x="280" y="144" class="annot-text" font-size="9">Competitor profiles: 5 active competitors</text>
  <text x="280" y="162" class="annot-text" font-size="9">Retail relationships: Amazon, Tesco, Boots</text>
  <text x="280" y="180" class="annot-text" font-size="9">Previous learnings: 37 recorded findings</text>
  
  <!-- Connector arrows: signals -> knowledge -->
  <line x1="190" y1="55" x2="260" y2="80" class="connector"/>
  <line x1="190" y1="80" x2="260" y2="100" class="connector"/>
  <line x1="190" y1="115" x2="260" y2="120" class="connector"/>
  <line x1="190" y1="145" x2="260" y2="140" class="connector"/>
  <line x1="190" y1="170" x2="260" y2="160" class="connector"/>
  
  <!-- RIGHT: Detection + Action -->
  <!-- What the system found -->
  <rect x="580" y="30" width="190" height="120" rx="2" class="action-box"/>
  <text x="595" y="50" class="label-mono" fill="#FF5A1F" font-weight="600">What the system found</text>
  <text x="595" y="70" class="annot-text" font-size="9">Competitor A shifted from</text>
  <text x="595" y="82" class="annot-text" font-size="9">price to quality messaging</text>
  <text x="595" y="98" class="annot-text" font-size="9">while increasing video spend</text>
  <text x="595" y="114" class="annot-text" font-size="9">by 40%. Your branded search</text>
  <text x="595" y="130" class="annot-text" font-size="9">conversion declined 12%.</text>
  
  <!-- Connector -> right -->
  <line x1="540" y1="90" x2="580" y2="80" class="connector"/>
  
  <!-- Resulting hypothesis -->
  <rect x="580" y="165" width="190" height="60" rx="2" fill="rgba(255,90,31,.06)" stroke="rgba(255,90,31,.15)" stroke-width="1"/>
  <text x="595" y="183" class="label-mono" fill="#FF5A1F" font-weight="600">Hypothesis</text>
  <text x="595" y="200" class="annot-text" font-size="9">Competitor repositioning may</text>
  <text x="595" y="214" class="annot-text" font-size="9">be eroding consideration.</text>
  
  <line x1="540" y1="120" x2="580" y2="195" class="connector"/>
  
  <!-- Proposed action -->
  <rect x="580" y="240" width="190" height="55" rx="2" class="action-box"/>
  <text x="595" y="258" class="label-mono" fill="#FF5A1F" font-weight="600">Proposed action</text>
  <text x="595" y="275" class="annot-text" font-size="9">Audit messaging relevance</text>
  <text x="595" y="290" class="annot-text" font-size="9">Investigate competitor creative</text>
  
  <line x1="580" y1="225" x2="590" y2="260" class="connector"/>
  
  <!-- Bottom: Learning loop -->
  <rect x="30" y="210" width="740" height="45" rx="2" fill="rgba(36,56,218,.03)" stroke="rgba(36,56,218,.12)" stroke-width="1"/>
  <text x="50" y="230" class="annot-text" font-size="10">Every signal, hypothesis, experiment, campaign result and outcome feeds back into the knowledge model.</text>
  <text x="50" y="246" class="annot-text" font-size="10">The next campaign starts from everything learned before. Knowledge accumulates. Decisions improve.</text>
  
  <!-- Bottom: Methodology note -->
  <text x="50" y="340" class="label-mono" font-size="9">Illustrative synthetic example. AI identifies correlations and patterns; causal validation requires experimental or econometric methods. Knowledge model content depends on available client data.</text>
</svg>
<div class="exhibit-finding">AI identified a pattern the team had not noticed: Competitor A’s messaging shift coincided with a measurable decline in branded search conversion. The system connects signals that would otherwise remain in separate dashboards and surfaces them as testable hypotheses.</div>
<div class="exhibit-footnote">Illustrative synthetic example. AI-surface patterns require human review and causal validation before action. Knowledge model populated from available client data and authorised external sources.</div>
</figure>
