<figure class="exhibit" role="figure" aria-label="Amazon analytical exhibit connecting media, commerce and signal">
<div class="exhibit-title">Amazon as media, commerce and signal</div>
<div class="exhibit-question">Connected analysis across campaign performance, product discovery, customer journeys and purchase outcomes</div>
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:800px;font-family:Montserrat,sans-serif">
  <defs>
    <style>
      .bg-line{stroke:rgba(10,10,11,.06);stroke-width:1}
      .label-mono{font-size:9px;fill:#71717A;font-weight:500;font-family:IBM Plex Mono,monospace}
      .label{font-size:10px;fill:#71717A;font-weight:300}
      .annot-text{font-size:10px;fill:#0A0A0B;font-weight:400}
      .annot-bold{font-size:11px;fill:#FF5A1F;font-weight:600}
      .blue-card{fill:rgba(36,56,218,.04);stroke:rgba(36,56,218,.2);stroke-width:1}
      .orange-card{fill:rgba(255,90,31,.04);stroke:rgba(255,90,31,.2);stroke-width:1}
      .flow-arrow{stroke:rgba(10,10,11,.15);stroke-width:1.5;fill:none}
      .bar-fill{fill:#2438DA}
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#FAFAF9"/>
  
  <!-- Three layer boxes -->
  <!-- Layer 1: Amazon as Media -->
  <rect x="30" y="20" width="230" height="100" rx="2" class="blue-card"/>
  <text x="50" y="45" class="label-mono" fill="#2438DA" font-weight="600">Amazon as media</text>
  <text x="50" y="64" class="annot-text" font-size="9">Sponsored Products: +18% impression share</text>
  <text x="50" y="80" class="annot-text" font-size="9">Sponsored Brands: +12% new-to-brand rate</text>
  <text x="50" y="96" class="annot-text" font-size="9">DSP: 2.4M reach, 3.2x ROAS</text>
  <text x="50" y="112" class="annot-text" font-size="9">Prime Video: 890k impressions</text>
  
  <!-- Layer 2: Amazon as Commerce -->
  <rect x="285" y="20" width="230" height="100" rx="2" class="blue-card"/>
  <text x="305" y="45" class="label-mono" fill="#2438DA" font-weight="600">Amazon as commerce</text>
  <text x="305" y="64" class="annot-text" font-size="9">Organic search: pos 3.2 avg (was 4.7)</text>
  <text x="305" y="80" class="annot-text" font-size="9">Conversion rate: 12.4% (vs cat 9.8%)</text>
  <text x="305" y="96" class="annot-text" font-size="9">New-to-brand: 34% of Q4 purchases</text>
  <text x="305" y="112" class="annot-text" font-size="9">Repeat rate: 22% (+3pp YoY)</text>
  
  <!-- Layer 3: Amazon as Signal -->
  <rect x="540" y="20" width="230" height="100" rx="2" class="blue-card"/>
  <text x="560" y="45" class="label-mono" fill="#2438DA" font-weight="600">Amazon as signal</text>
  <text x="560" y="64" class="annot-text" font-size="9">Search share: 18% branded, 8% category</text>
  <text x="560" y="80" class="annot-text" font-size="9">Customer journeys: 2.7 touchpoints avg</text>
  <text x="560" y="96" class="annot-text" font-size="9">AMC: 3 audience segments identified</text>
  <text x="560" y="112" class="annot-text" font-size="9">Cross-visit rate: 41% to brand site</text>
  
  <!-- Connecting arrows -->
  <text x="270" y="70" class="annot-text" fill="#71717A" font-size="18">→</text>
  <text x="525" y="70" class="annot-text" fill="#71717A" font-size="18">→</text>
  
  <!-- Bottom: Journey insight -->
  <rect x="30" y="140" width="740" height="80" rx="2" fill="rgba(255,90,31,.03)" stroke="rgba(255,90,31,.15)" stroke-width="1"/>
  <text x="50" y="162" class="annot-bold" font-size="11">Customer journey insight (AMC data, aggregated)</text>
  <text x="50" y="182" class="annot-text" font-size="10">Shoppers exposed to both Sponsored Products and DSP were 2.3x more likely to purchase than DSP-only audiences.</text>
  <text x="50" y="198" class="annot-text" font-size="10">The highest-value journeys involved: Brand Search → Product Detail Page → Purchase (avg £47 AOV).</text>
  <text x="50" y="214" class="annot-text" font-size="10">Cross-channel exposure (Amazon + off-site media) lifted conversion by 18% vs Amazon-only.</text>
  
  <!-- Bottom: What this reveals -->
  <rect x="30" y="240" width="740" height="100" rx="2" fill="rgba(36,56,218,.03)" stroke="rgba(36,56,218,.15)" stroke-width="1"/>
  <text x="50" y="262" class="label-mono" fill="#2438DA" font-weight="600">What a standalone campaign dashboard would not reveal</text>
  <text x="50" y="284" class="annot-text" font-size="10">Amazon search behaviour for competitor product terms increased 22% six weeks before Competitor A’s new product launch.</text>
  <text x="50" y="300" class="annot-text" font-size="10">This pattern was visible in AMC search query data 4–6 weeks before it appeared in competitive reporting.</text>
  <text x="50" y="316" class="annot-text" font-size="10">Implication: Amazon search signals may function as an early-warning system for competitor activity.</text>
  
  <!-- Footnote -->
  <text x="50" y="375" class="label" font-size="9">Illustrative synthetic data. AMC provides aggregated, privacy-compliant audience insights, not individual-level tracking. Causal incrementality requires experimental validation beyond observed correlations.</text>
</svg>
<div class="exhibit-finding">Amazon search behaviour predicts competitor product launches 6–8 weeks before they appear in competitive intelligence reporting. Connecting media, commerce and signal layers creates a more complete commercial picture than any single dashboard.</div>
<div class="exhibit-footnote">Illustrative synthetic example. AMC insights are aggregated and privacy-compliant. Correlation does not imply causation without experimental validation.</div>
</figure>
